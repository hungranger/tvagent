# Stage map:
#   pre-commit (fast, every commit): ruff lint + format, gitleaks secret scan.
#               Kept TDD-RED-friendly: a commit that references a
#               not-yet-created symbol must not be blocked here.
#   pre-push   (heavier, before push): pyright (strict), pytest + coverage,
#               pip-audit, uv lockfile drift check, semgrep, ruff ARG
#               (unused args), vulture (dead code).
# Reuse in another project: copy this file + the [tool.ruff]/[tool.pyright]/
# [tool.coverage] blocks from pyproject.toml, then run `pre-commit install`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff
        args: [--fix]
        stages: [pre-commit]
      - id: ruff-format
        stages: [pre-commit]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (hexagonal architecture contracts)
        entry: lint-imports
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pyright
        name: pyright (strict)
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-cov
        name: pytest + coverage
        entry: pytest --cov --cov-report=term-missing --cov-fail-under=92
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit (dependency CVEs)
        entry: sh -c 'uv export --no-hashes --extra dev --extra run | pip-audit -r -'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: uv-lock-check
        name: uv lock --check (lockfile drift)
        # `uv lock --check` verifies the lockfile is current vs pyproject WITHOUT
        # mutating the environment. Do NOT use `uv sync --locked` here — it prunes
        # the dev/run extras from the working venv on every push.
        entry: uv lock --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: semgrep
        name: semgrep (python + security-audit)
        entry: semgrep --config p/python --config p/security-audit --error
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ruff-arg
        name: ruff --select ARG (unused function args)
        entry: ruff check --select ARG .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: vulture
        name: vulture (dead code)
        entry: vulture src tests .vulture_allowlist.py --min-confidence 60
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
