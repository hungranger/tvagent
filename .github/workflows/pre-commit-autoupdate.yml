name: pre-commit-autoupdate

# Dependabot only bumps `pip`/`github-actions` deps — it can't see the pinned
# `rev`s in .pre-commit-config.yaml (ruff-pre-commit, gitleaks, semgrep,
# pre-commit-hooks). This covers that gap: weekly `pre-commit autoupdate`,
# opened as a PR for review (never auto-merged).

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pre-commit

      - run: pre-commit autoupdate

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: pre-commit autoupdate"
          title: "chore: pre-commit autoupdate"
          branch: chore/pre-commit-autoupdate
          delete-branch: true
