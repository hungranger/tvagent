name: ci

# Server-side enforcement of the SAME gate as the local pre-commit/pre-push
# hooks. Single source of truth: this job runs `pre-commit run` against
# .pre-commit-config.yaml rather than re-listing ruff/pyright/pytest/etc
# here — keep tool config changes in .pre-commit-config.yaml / pyproject.toml
# and this workflow picks them up automatically.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # gate_ratchet.py / suppression_diff.py diff against origin/master

      - name: Fetch base ref
        # actions/checkout fetches only the PR ref by default; make sure
        # origin/<base> is resolvable even though fetch-depth:0 usually
        # covers it (belt-and-braces for shallow/partial runner clones).
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Gate ratchet (fail on weakened gates)
        # Compares this tree's quality-gates.toml against origin/master and fails
        # if any gate was weakened. See scripts/gate_ratchet.py.
        #
        # Anti-gaming: run origin/master's copy of the judge AND its gate_setup
        # package (the judge imports gate_setup.manifest), NEVER the PR's own —
        # otherwise a PR that neuters the judge or its manifest registry would
        # pass itself. We fetch master's whole gate_setup/ into $RUNNER_TEMP and
        # import it via PYTHONPATH, so the PR working tree is never on the import
        # path. The judge still READS the PR working-tree quality-gates.toml (the
        # data under test) and fetches master's own copy via `git show`.
        #
        # This is an explicit if/then/else, NOT `master && python || {PR copy}`:
        # a `||` fallthrough would run the PR's own judge whenever master's judge
        # exits non-zero — including exit 1 = "weakening detected" — letting a
        # weakening PR pass itself. A FAILING master judge must FAIL the job (fail
        # closed). The PR copy runs ONLY when master has no gate_ratchet.py yet
        # (first-introduction PR, CODEOWNER-reviewed anyway). When master's judge
        # predates gate_setup/, the archive step is skipped (its old stdlib copy
        # imports nothing) and it still runs correctly.
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/master:scripts/gate_ratchet.py 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/scripts"
            git show origin/master:scripts/gate_ratchet.py > "$RUNNER_TEMP/scripts/gate_ratchet.py"
            if git cat-file -e origin/master:scripts/gate_setup/manifest.py 2>/dev/null; then
              git archive origin/master scripts/gate_setup | tar -x -C "$RUNNER_TEMP"
            fi
            PYTHONPATH="$RUNNER_TEMP/scripts" python "$RUNNER_TEMP/scripts/gate_ratchet.py"
          else
            echo "note: origin/master has no gate_ratchet.py yet (bootstrap) — running PR copy"
            python scripts/gate_ratchet.py
          fi

      - name: Gate drift (native config must equal the manifest)
        # The ratchet guards quality-gates.toml, but the ACTUAL thresholds live in
        # pyproject.toml. This BLOCKING step fails if any [drift]-bound native value
        # (e.g. pyproject fail_under, ruff mccabe/select, pyright mode, vulture
        # min_confidence) diverges from quality-gates.toml -- closing the hole where
        # a PR lowers pyproject fail_under 92->50 while leaving the manifest at 92.
        #
        # Anti-gaming: run origin/master's gate_setup (the check CODE), never the
        # PR's own -- a PR editing its own manifest.py could neuter the check. The
        # DATA under test is the PR working tree (quality-gates.toml [drift]
        # bindings + the native files they point at). Fetch master's whole
        # gate_setup/ into $RUNNER_TEMP and import it via PYTHONPATH. Same
        # if/then/else bootstrap guard (PR copy only when master lacks the package,
        # first-introduction PR, CODEOWNER-reviewed); a failing drift check FAILS
        # the job (no || fallthrough).
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/master:scripts/gate_setup/manifest.py 2>/dev/null; then
            git archive origin/master scripts/gate_setup | tar -x -C "$RUNNER_TEMP"
            PYTHONPATH="$RUNNER_TEMP/scripts" python -m gate_setup.manifest check-drift --file quality-gates.toml --profile .
          else
            echo "note: origin/master has no scripts/gate_setup/ yet (bootstrap) — running PR copy"
            PYTHONPATH=scripts python -m gate_setup.manifest check-drift --file quality-gates.toml --profile .
          fi

      - name: Suppression diff (visibility only, non-blocking)
        # Prints GitHub annotations for newly-added suppressions in this PR's
        # diff vs origin/master so a human reviewer sees them inline. Stdlib-only,
        # imports no gate_setup, always exits 0 -- see scripts/suppression_diff.py.
        # Anti-gaming: run origin/master's copy (same rationale as the ratchet).
        # Same explicit if/then/else (no `||` fallthrough): the PR copy runs ONLY
        # when master lacks the script. Non-blocking, so lower risk, but the
        # fallthrough is removed for consistency.
        if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e origin/master:scripts/suppression_diff.py 2>/dev/null; then
            git show origin/master:scripts/suppression_diff.py > "$RUNNER_TEMP/suppression_diff.py"
            python "$RUNNER_TEMP/suppression_diff.py"
          else
            echo "note: origin/master has no suppression_diff.py yet (bootstrap) — running PR copy"
            python scripts/suppression_diff.py
          fi

      - name: Install project + test deps
        # Matches nightly-mutation.yml: numpy is a top-level import in
        # stt/speakerid modules but isn't a `dev` dependency.
        run: pip install -e ".[dev]" numpy

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (pre-commit stage)
        run: pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure

      - name: Run pre-commit (pre-push stage)
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
