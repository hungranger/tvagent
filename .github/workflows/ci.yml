name: ci

# Server-side enforcement of the SAME gate as the local pre-commit/pre-push
# hooks. Single source of truth: this job runs `pre-commit run` against
# .pre-commit-config.yaml rather than re-listing ruff/pyright/pytest/etc
# here — keep tool config changes in .pre-commit-config.yaml / pyproject.toml
# and this workflow picks them up automatically.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # gate_ratchet.py / suppression_diff.py diff against origin/master

      - name: Fetch base ref
        # actions/checkout fetches only the PR ref by default; make sure
        # origin/<base> is resolvable even though fetch-depth:0 usually
        # covers it (belt-and-braces for shallow/partial runner clones).
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4

      - name: Gate ratchet (fail on weakened gates)
        # Stdlib-only script -- no project deps needed, so it can run right
        # after setup-python. Compares this tree's gate settings against
        # origin/master and fails if any were weakened. See scripts/gate_ratchet.py.
        # Anti-gaming: run origin/master's copy of the judge, NOT the PR's own —
        # otherwise a PR that neuters this script would pass itself. The
        # bootstrap fallback (PR copy) only fires when master has no
        # gate_ratchet.py yet (the first-introduction PR, which is
        # CODEOWNER-reviewed anyway).
        if: github.event_name == 'pull_request'
        run: |
          git show origin/master:scripts/gate_ratchet.py > "$RUNNER_TEMP/gate_ratchet.py" 2>/dev/null \
            && python "$RUNNER_TEMP/gate_ratchet.py" \
            || { echo "note: origin/master has no gate_ratchet.py yet (bootstrap) — running PR copy"; python scripts/gate_ratchet.py; }

      - name: Suppression diff (visibility only, non-blocking)
        # Prints GitHub annotations for newly-added suppressions in this PR's
        # diff vs origin/master so a human reviewer sees them inline. Always
        # exits 0 -- see scripts/suppression_diff.py.
        # Anti-gaming: run origin/master's copy (same rationale as above);
        # bootstrap fallback only when master lacks the script.
        if: github.event_name == 'pull_request'
        run: |
          git show origin/master:scripts/suppression_diff.py > "$RUNNER_TEMP/suppression_diff.py" 2>/dev/null \
            && python "$RUNNER_TEMP/suppression_diff.py" \
            || { echo "note: origin/master has no suppression_diff.py yet (bootstrap) — running PR copy"; python scripts/suppression_diff.py; }

      - name: Install project + test deps
        # Matches nightly-mutation.yml: numpy is a top-level import in
        # stt/speakerid modules but isn't a `dev` dependency.
        run: pip install -e ".[dev]" numpy

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (pre-commit stage)
        run: pre-commit run --all-files --hook-stage pre-commit --show-diff-on-failure

      - name: Run pre-commit (pre-push stage)
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure
