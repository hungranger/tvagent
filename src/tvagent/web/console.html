<!doctype html><meta charset="utf-8"><title>TV Agent — Console</title>
<style>
  :root{--bg:#0b0f14;--panel:#111823;--fg:#e8eef5;--muted:#7c8b9a;--accent:#4fd1ff;
        --line:#1e2a37;--ok:#57d38c;--warn:#ffb454}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:15px/1.5 system-ui,sans-serif}
  .wrap{display:grid;grid-template-columns:1fr 380px;gap:16px;height:100%;padding:16px}
  @media(max-width:820px){.wrap{grid-template-columns:1fr;height:auto}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  /* TV preview */
  #tv{display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;min-height:340px}
  #orb{width:110px;height:110px;border-radius:50%;margin-bottom:22px;
    background:radial-gradient(circle at 40% 35%,#4fd1ff,#1567a8);
    animation:pulse 2s ease-in-out infinite}
  #orb.idle{animation:none;filter:grayscale(.6) brightness(.6)}
  @keyframes pulse{50%{transform:scale(1.08);opacity:.85}}
  #who{color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-size:13px}
  #text{font-size:24px;margin-top:6px;max-width:80%}
  .col{display:flex;flex-direction:column;gap:14px;overflow:auto}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px}
  label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:4px}
  input[type=range]{width:100%}
  button{background:#1a2635;color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:9px 14px;font-size:14px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  #listen.on{background:var(--ok);color:#062;border-color:var(--ok)}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  select,input[type=text]{background:#0d141d;color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:8px}
  #status{font-size:12px;color:var(--muted)}
  #log{font:12px/1.5 ui-monospace,monospace;background:#0a0f16;border:1px solid var(--line);
    border-radius:8px;padding:10px;height:230px;overflow:auto;white-space:pre-wrap}
  .stage{color:var(--accent)} .val{color:var(--fg)} .err{color:var(--warn)}
  #state{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600;
    padding:8px 14px;border-radius:999px;margin-bottom:10px}
  #state .dot{width:10px;height:10px;border-radius:50%}
  #state.asleep{background:#1a2330;color:var(--muted)} #state.asleep .dot{background:var(--muted)}
  #state.awake{background:#123020;color:var(--ok)} #state.awake .dot{background:var(--ok);
    box-shadow:0 0 0 0 var(--ok);animation:ping 1.6s ease-out infinite}
  #state.busy{background:#0e2740;color:var(--accent)} #state.busy .dot{background:var(--accent)}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(87,211,140,.5)}100%{box-shadow:0 0 0 9px rgba(87,211,140,0)}}
</style>

<div class="wrap">
  <!-- TV render preview -->
  <div class="card" id="tv">
    <div id="orb" class="idle"></div>
    <div id="who"></div>
    <div id="text">Disconnected</div>
  </div>

  <!-- Control panel -->
  <div class="col">
    <div class="card">
      <h2>Listening</h2>
      <div id="state" class="asleep"><span class="dot"></span><span id="stateLabel">connecting…</span></div>
      <button id="listen">▶ Start listening</button>
      <p id="status">connecting…</p>
    </div>

    <div class="card">
      <h2>Speaker-ID tuning</h2>
      <label>Threshold <span class="val" id="thV">–</span></label>
      <input type="range" id="th" min="0" max="1" step="0.01">
      <label style="margin-top:10px">Margin <span class="val" id="mgV">–</span></label>
      <input type="range" id="mg" min="0" max="0.5" step="0.01">
    </div>

    <div class="card">
      <h2>TTS voice</h2>
      <select id="voice">
        <option>en_US-amy-medium</option>
        <option>en_US-ryan-high</option>
        <option>en_US-lessac-medium</option>
        <option>en_US-hfc_female-medium</option>
        <option>en_US-hfc_male-medium</option>
      </select>
    </div>

    <div class="card">
      <h2>Enroll a voice</h2>
      <div class="row">
        <input type="text" id="name" placeholder="Name (e.g. Dad)">
        <button id="enroll" style="flex:0 0 auto">Record 30s</button>
      </div>
      <p id="people" style="font-size:12px;color:var(--muted)"></p>
    </div>

    <div class="card">
      <h2>Live log</h2>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let ws, listening = false, inTurn = false, wakeWord = "";

function renderState(){
  const el = $("state"), lab = $("stateLabel");
  if(!ws || ws.readyState !== 1){ el.className = "asleep"; lab.textContent = "disconnected"; return; }
  if(!listening){ el.className = "asleep"; lab.textContent = "😴 Asleep — not listening"; }
  else if(inTurn){ el.className = "busy"; lab.textContent = "💬 Responding…"; }
  else { el.className = "awake"; lab.textContent = '👂 Awake — say "' + (wakeWord || "the wake word") + '"'; }
  $("orb").classList.toggle("idle", !listening);
}

function log(html, cls){
  const el = $("log");
  const line = document.createElement("div");
  if(cls) line.className = cls;
  line.innerHTML = new Date().toLocaleTimeString() + "  " + html;
  el.appendChild(line); el.scrollTop = el.scrollHeight;
}

function connect(){
  ws = new WebSocket("ws://localhost:8765");
  ws.onopen = () => { $("status").textContent = "connected"; $("text").textContent = "Ready"; renderState(); };
  ws.onclose = () => { $("status").textContent = "disconnected — retrying…";
    $("text").textContent = "Disconnected"; inTurn = false; renderState(); setTimeout(connect, 1500); };
  ws.onmessage = e => handle(JSON.parse(e.data));
}

function send(obj){ if(ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function handle(m){
  if(m.type === "render"){
    $("who").textContent = m.person || "";
    $("text").textContent = m.text || "";
  } else if(m.type === "event"){
    renderEvent(m);
  } else if(m.type === "status"){
    applyStatus(m);
  }
}

function renderEvent(m){
  const s = m.stage;
  if(s === "wake"){ inTurn = true; renderState(); }
  else if(s === "ack") log('<span class="stage">ack</span> "'+m.text+'"');
  else if(s === "spoken" || s === "ignored" || s === "error"){ inTurn = false; renderState(); }
  if(s === "wake")            log('<span class="stage">wake</span> — heard wake word');
  else if(s === "identified") log('<span class="stage">who</span> → <span class="val">'+m.name+'</span>');
  else if(s === "transcribed")log('<span class="stage">said</span> "'+m.said+'"');
  else if(s === "replied")    log('<span class="stage">reply</span> "'+m.reply+'"');
  else if(s === "spoken")     log('<span class="stage">spoken</span> ✓');
  else if(s === "ignored")    log('<span class="stage">ignored</span> no speech detected');
  else if(s === "enroll_start")log('<span class="stage">enroll</span> recording '+m.seconds+'s for '+m.name+'…');
  else if(s === "enroll_done") log('<span class="stage">enroll</span> ✓ '+m.name+' registered');
  else if(s === "error")       log('<span class="err">error</span> '+m.message, "err");
}

function applyStatus(m){
  listening = !!m.listening;
  if(m.wake) wakeWord = m.wake;
  $("listen").textContent = listening ? "⏸ Stop listening" : "▶ Start listening";
  $("listen").classList.toggle("on", listening);
  renderState();
  if(m.threshold != null){ $("th").value = m.threshold; $("thV").textContent = (+m.threshold).toFixed(2); }
  if(m.margin != null){ $("mg").value = m.margin; $("mgV").textContent = (+m.margin).toFixed(2); }
  if(m.voice) $("voice").value = m.voice;
  if(m.people) $("people").textContent = m.people.length ? "Enrolled: " + m.people.join(", ") : "No one enrolled yet";
}

$("listen").onclick = () => send({cmd:"listen", on: !listening});
$("th").oninput = () => $("thV").textContent = (+$("th").value).toFixed(2);
$("mg").oninput = () => $("mgV").textContent = (+$("mg").value).toFixed(2);
$("th").onchange = () => send({cmd:"tune", threshold:+$("th").value, margin:+$("mg").value});
$("mg").onchange = () => send({cmd:"tune", threshold:+$("th").value, margin:+$("mg").value});
$("voice").onchange = () => send({cmd:"voice", name:$("voice").value});
$("enroll").onclick = () => { const n = $("name").value.trim(); if(n) send({cmd:"enroll", name:n}); };

connect();
</script>
