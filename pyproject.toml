[project]
name = "tvagent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff==0.15.7", "pyright", "pytest-cov", "pre-commit", "vulture", "import-linter", "pip-audit"]
# webrtcvad-wheels (maintained fork, prebuilt wheels): drop-in `import webrtcvad`,
# but without the original's `import pkg_resources` — which breaks on setuptools>=81
# (removed) and would otherwise force a pin to CVE-affected setuptools<81.
run = ["anthropic", "faster-whisper", "piper-tts", "speechbrain", "openwakeword", "webrtcvad-wheels", "websockets", "sounddevice", "numpy", "openai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["component: real-backend tests needing models/audio fixtures"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Machine-generated (vulture --make-whitelist) allowlist stub, not real code.
# skills/ ships its own deliberately-messy fixtures for a Claude skill; not part of the app.
extend-exclude = [".vulture_allowlist.py", "skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF", "N", "C4", "C901", "PTH"]
# PLR2004 = magic value used in comparison — this is the "no magic number/string" rule.

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Tests may use literals freely (assertions, fixtures) and don't need the magic-value rule.
# ARG is only enforced on pre-push (ruff-arg local hook), not in the main
# `select` above (that would run it pre-commit). Ignore it where unused args
# are interface-mandated, not dead: test fakes/stubs satisfy Protocols, and
# Protocol methods in ports.py declare params they never use.
"tests/**" = ["PLR2004", "S101", "ARG001", "ARG002"]
"scripts/**" = ["PLR2004"]
"src/tvagent/core/ports.py" = ["ARG001", "ARG002"]

[tool.pyright]
include = ["src", "tests", "scripts"]
# .vulture_allowlist.py is a vulture whitelist stub (bare names, not real
# code) at the repo root — already outside `include`, excluded explicitly too
# so this stays true regardless of how `include` evolves.
# skills/ is also outside `include`; excluded explicitly for the same reason.
exclude = [".vulture_allowlist.py", "skills"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# Optional runtime backends (anthropic, faster_whisper, piper, speechbrain, torch,
# webrtcvad, sounddevice, openwakeword, numpy, websockets) are not installed in the
# dev/type-check environment and several ship no type stubs. Do not fail on them.
reportMissingImports = "none"
reportMissingModuleSource = "none"
# Some of these ship no py.typed/stubs even when installed (e.g. in an env with
# the `run` extras present): downgrade to warning rather than "none" so the
# untyped-dependency signal stays visible instead of silently hidden, while
# still not failing the gate (pyright's exit code only reflects errors).
reportMissingTypeStubs = "warning"

[tool.vulture]
min_confidence = 60

[tool.mutmut]
source_paths = ["src/tvagent/"]
pytest_add_cli_args_test_selection = ["tests/"]
# Mutate only lines pytest actually exercises, and reuse the [tool.coverage.report]
# exclude_also patterns above (mutmut applies coverage.py's excluded-lines analysis
# unconditionally) to skip hardware/IO-only code with no CI-runnable tests: the real
# _default_* embedders/synth/play, MicSource, record_seconds, WebDisplay._serve,
# lazy heavy-dep construction paths, and config.py's real-adapter factories. Everything
# else (orchestrator, memory_json, config's build_orchestrator/_get dispatch, speakerid
# cosine/identify, audio_vad VadCapture silence logic, llm
# text-extraction, tts empty-text guard, display state_to_json) stays mutated.
mutate_only_covered_lines = true

[tool.coverage.run]
source = ["src/tvagent"]
branch = true
omit = ["skills/*"]

[tool.coverage.report]
show_missing = true
fail_under = 92
exclude_also = [
    "if __name__ == .__main__.:",
    "def _default_",              # hardware-backed default synth/play/embed paths
    "class MicSource",            # live mic source, no CI coverage
    "def record_seconds",         # live mic capture
    "def _serve",                 # websocket server thread
    "class WebDisplay",           # live websocket display server, no CI coverage
    "if client is None:",         # lazy real anthropic client construction
    "if _model is None:",         # lazy real faster-whisper model construction
    "if self._detector is None:", # lazy real openwakeword model construction
    "if self._source is None:",   # lazy real mic source construction
    "def main\\(\\) -> None:",     # enroll.py CLI glue: mic capture + real embedding model
    "def _(memory|wake|capture|speaker|stt|llm|tts|display|barge_in|with_aec)\\(",  # config.py real-adapter factories, tested via overrides
    "def _load_model",            # hardware-backed model download/load (ECAPA, Piper), tested via stubbed warmup
]

[tool.importlinter]
root_package = "tvagent"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core stays pure"
type = "forbidden"
source_modules = ["tvagent.core"]
forbidden_modules = [
    "tvagent.adapters",
    "tvagent.config",
    "tvagent.app",
    "tvagent.enroll",
    "tvagent.audio",
    "anthropic",
    "faster_whisper",
    "piper",
    "speechbrain",
    "torch",
    "numpy",
    "webrtcvad",
    "sounddevice",
    "openwakeword",
    "websockets",
]

[[tool.importlinter.contracts]]
name = "Layered architecture (core -> audio -> adapters -> config -> app/enroll)"
type = "layers"
layers = [
    "tvagent.app | tvagent.enroll",
    "tvagent.config",
    "tvagent.adapters",
    "tvagent.audio",
    "tvagent.core",
]

[[tool.importlinter.contracts]]
name = "Port adapters are independent of each other"
type = "independence"
modules = [
    "tvagent.adapters.memory_json",
    "tvagent.adapters.llm_claude",
    "tvagent.adapters.llm_openai",
    "tvagent.adapters.stt_whisper",
    "tvagent.adapters.stt_mlx",
    "tvagent.adapters.stt_parakeet",
    "tvagent.adapters.speakerid_ecapa",
    "tvagent.adapters.wakeword_oww",
    "tvagent.adapters.audio_vad",
    "tvagent.adapters.bargein_vad",
    "tvagent.adapters.aec_gain",
    "tvagent.adapters.tts_piper",
    "tvagent.adapters.tts_kokoro",
    "tvagent.adapters.tts_tap",
    "tvagent.adapters.display_web",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
